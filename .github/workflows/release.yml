name: Release Windows

# Branch pushes and pull requests do not trigger builds.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.event.deleted != true
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust and checks
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default 1.99.1
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed' }

      - name: Cache Rust dependencies and build outputs
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-rust-1.99.1-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            windows-rust-1.99.1-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}-

      - name: Check release version
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $version = ($metadata.packages | Where-Object name -eq 'dnsping').version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME must match Cargo.toml version v$version"
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build portable Windows package
        run: ./scripts/package.ps1

      - name: Save package for pre-release verification
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DNSPing-preview
          path: |
            dist/DNSPing-windows-x64.zip
            dist/SHA256SUMS.txt
          retention-days: 7

      - name: Publish release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          $assets = @('dist/DNSPing-windows-x64.zip', 'dist/SHA256SUMS.txt')
          gh release view $tag --repo $repo --json id 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
            $existingAssets = gh release view $tag --repo $repo --json assets --jq '.assets[].name'
            if ($LASTEXITCODE -ne 0) { throw 'Release asset listing failed' }
            foreach ($obsolete in @('DNSPing-source.zip', 'DNSPing.exe')) {
              if ($existingAssets -contains $obsolete) {
                gh release delete-asset $tag $obsolete --repo $repo --yes
                if ($LASTEXITCODE -ne 0) { throw "Failed to remove obsolete asset $obsolete" }
              }
            }
          } else {
            gh release create $tag @assets --repo $repo --verify-tag --draft --title "DNSPing $tag" --notes-file docs/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          $publishArgs = @('release', 'edit', $tag, '--repo', $repo, '--draft=false')
          if ($tag.Contains('-')) { $publishArgs += '--prerelease' }
          gh @publishArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

      - name: Save compilation cache even when a later check fails
        if: always() && !cancelled() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
